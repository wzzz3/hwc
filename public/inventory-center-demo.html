<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>库存中心 · 演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f8ff;color:#1b2d43;font:14px/1.6 "Microsoft YaHei UI","Microsoft YaHei",sans-serif}header{height:64px;background:#fff;border-bottom:1px solid #dce5f0;padding:16px 24px;font-size:20px;font-weight:700;color:#173f65}header small{font-size:12px;font-weight:500}main{display:block;min-height:calc(100vh - 64px)}nav{display:flex;overflow:auto;gap:4px;padding:8px 24px;background:#f8faff;border-bottom:1px solid #dce5f0}button,input,select{font:inherit;color:#1b2d43;border:1px solid #c9d8ec;border-radius:6px;background:#fff;padding:7px 12px;min-height:34px;margin:4px}button,select{cursor:pointer}button:hover{background:#edf4ff;border-color:#94b6ee;color:#135cca}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #1768ef;outline-offset:2px}nav button{display:block;flex:none;text-align:center;margin:3px 0;border-color:transparent;background:transparent;color:#526279;padding:10px 14px}.active{background:#e9f2ff!important;color:#246bd1!important;font-weight:700}section{margin:24px;flex:1;min-width:0;background:#fff;border:1px solid #d6e2f3;border-radius:8px;padding:24px;box-shadow:0 2px 5px #234c8110}h1{font-size:26px;line-height:1.35;margin:0}h3{font-size:18px;margin:24px 0 8px}p{line-height:1.6}.muted{color:#66788e}aside{background:#edf5ff;border:1px solid #d5e6fb;border-radius:6px;color:#42678f;padding:12px 16px;margin:20px 0}.scroll{overflow:auto;margin-top:18px;border:1px solid #dce5f0;border-radius:6px}table{width:100%;border-collapse:collapse;min-width:720px}td,th{padding:12px 14px;border-bottom:1px solid #edf2f8;text-align:left}th{background:#f3f7fd;color:#526279;font-size:12px;font-weight:600}tbody tr:hover{background:#f8fbff}tbody tr:last-child td{border-bottom:0}.cards{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px}.card{background:#fff;border:1px solid #d6e2f3;border-radius:8px;padding:20px;flex:1;min-width:150px;color:#60728c;box-shadow:0 2px 5px #234c8110}.card b{display:block;color:#203f65;font-size:26px;line-height:1.3;margin-top:12px}.layout{display:flex;gap:20px;margin-top:18px}.layout .scroll{margin-top:0}.tree{min-width:200px;background:#f8faff;border:1px solid #dce5f0;border-radius:8px;padding:16px}.tree label{display:block;padding:4px 0;color:#526279}.tree input[type=checkbox]{min-height:0;margin-right:8px;accent-color:#246bd1}.tree input:not([type=checkbox]){max-width:190px} @media(max-width:700px){header{height:auto}header small{float:none!important;display:block}main{display:block}nav{width:auto;display:flex;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid #dce5f0}nav button{min-width:100px;text-align:center}section{margin:12px;padding:16px}.layout{display:block}.tree{margin-bottom:15px}.cards{gap:10px}.card{padding:14px}}
</style><header>◈ 库存中心 <small style="float:right;color:#bc8834">演示数据 · 非真实业务数据</small></header><main><nav id="nav"></nav><section id="app"></section></main><script>
const pages=['库存总览','库存明细','仓库库存','库存流水','库存预警','仓库管理'];const warehouses=[['Amazon FBA','平台仓'],['Walmart WFS','平台仓'],['TikTok FBT','平台仓'],['TEMU','平台仓'],['速星','第三方仓'],['Flash','第三方仓'],['天屿','第三方仓'],['中南通达','第三方仓'],['友乐','第三方仓'],['金仓德国','第三方仓'],['金仓英国','第三方仓'],['其他','其他仓']];let page=0,selected=[],expanded='',term='',type='全部',treeTerm='';const data=warehouses.map((w,i)=>({sku:i%2?'DEMO-002':'DEMO-001',name:i%2?'演示商品 B':'演示商品 A',wh:w[0],type:w[1],pool:i<4?'平台库存池':'海外库存池',channel:i<4?w[0]:'多渠道',available:100+i*10,transit:20+i,pending:i%3*10,days:10+i*3}));function filtered(){return data.filter(x=>(!selected.length||selected.includes(x.wh))&&(type==='全部'||x.type===type)&&Object.values(x).join(' ').toLowerCase().includes(term.toLowerCase()))}function go(i){page=i;selected=[];term='';type='全部';draw()}function table(h,rows){return `<div class="scroll"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${h.length}">暂无匹配数据</td></tr>`}</tbody></table></div>`}function exportCSV(){let rows=filtered();let csv=[['SKU','商品','仓库','仓库类型','库存池','渠道','可用','在途','待确认'],...rows.map(x=>[x.sku,x.name,x.wh,x.type,x.pool,x.channel,x.available,x.transit,x.pending])].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='库存演示数据.csv';a.click();URL.revokeObjectURL(a.href)}function toggle(w){selected=selected.includes(w)?selected.filter(x=>x!==w):[...selected,w];draw()}function setTerm(v){term=v;draw();let e=document.getElementById('search');e.focus();e.setSelectionRange(v.length,v.length)}function setTree(v){treeTerm=v;draw();let e=document.getElementById('treeSearch');e.focus();e.setSelectionRange(v.length,v.length)}function draw(){nav.innerHTML=pages.map((x,i)=>`<button class="${page===i?'active':''}" onclick="go(${i})">${x}</button>`).join('');let rows=filtered(),sum=(rs,k)=>rs.reduce((a,x)=>a+x[k],0), body='';const filters=`<div><input id="search" placeholder="搜索 SKU、商品或仓库" value="${term}" oninput="setTerm(this.value)"><select onchange="type=this.value;draw()">${['全部','平台仓','第三方仓','其他仓'].map(x=>`<option ${type===x?'selected':''}>${x}</option>`).join('')}</select><button onclick="exportCSV()">导出演示 CSV</button></div>`;if(page===0)body=`<div class="cards">${[['平台仓可用',sum(rows.filter(x=>x.type==='平台仓'),'available')],['第三方仓可用',sum(rows.filter(x=>x.type==='第三方仓'),'available')],['在途',sum(rows,'transit')],['待确认',sum(rows,'pending')]].map(x=>`<div class="card">${x[0]}<b>${x[1]} 件</b></div>`).join('')}</div><h3>仓库类型分布</h3><p>平台仓、第三方仓和其他仓分别管理，库存池与销售渠道分别记录。</p><button onclick="go(4)">查看预警 →</button>`;if(page===1){let groups=[...new Set(rows.map(x=>x.sku))];body=`<div class="layout"><div class="tree"><b>仓库筛选（可多选）</b><input id="treeSearch" placeholder="搜索仓库" value="${treeTerm}" oninput="setTree(this.value)">${warehouses.filter(w=>w[0].toLowerCase().includes(treeTerm.toLowerCase())).map(w=>`<label><input type="checkbox" ${selected.includes(w[0])?'checked':''} onchange="toggle('${w[0]}')">${w[0]} <small>${w[1]}</small></label>`).join('')}<button onclick="selected=[];draw()">清空选择</button></div><div style="flex:1;min-width:0">${table(['SKU / 商品','仓库数','可用','在途','待确认','操作'],groups.map(s=>{let g=rows.filter(x=>x.sku===s);return `<tr><td>${s}<br>${g[0].name}</td><td>${g.length}</td><td>${sum(g,'available')}</td><td>${sum(g,'transit')}</td><td>${sum(g,'pending')}</td><td><button onclick="expanded=expanded==='${s}'?'':'${s}';draw()">${expanded===s?'收起':'跨仓展开'}</button></td></tr>${expanded===s?g.map(x=>`<tr style="background:#f7fbff"><td>↳ ${x.wh}</td><td>${x.type}</td><td>${x.available}</td><td>${x.transit}</td><td>${x.pending}</td><td>${x.pool} / ${x.channel}</td></tr>`).join(''):''}`}).join(''))}</div></div>`}if(page===2)body=table(['仓库','类型','库存池','渠道','可用','在途','待确认'],rows.map(x=>`<tr>${[x.wh,x.type,x.pool,x.channel,x.available,x.transit,x.pending].map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''));if(page===3)body=`<p>以下为模拟流水，仅用于展示，不代表真实业务记录。</p>`+table(['模拟时间','SKU','仓库','库存池','渠道','类型','数量'],rows.map(x=>`<tr><td>演示日期</td><td>${x.sku}</td><td>${x.wh}</td><td>${x.pool}</td><td>${x.channel}</td><td>模拟入库</td><td>+${x.transit}</td></tr>`).join(''));if(page===4)body=table(['SKU','仓库','渠道','可用','预计可售天数','预警'],rows.filter(x=>x.days<20).map(x=>`<tr><td>${x.sku}</td><td>${x.wh}</td><td>${x.channel}</td><td>${x.available}</td><td>${x.days} 天</td><td>库存不足</td></tr>`).join(''))+'<p class="muted">演示阈值：预计可售天数低于 20 天；待确认库存不参与预测。</p>';if(page===5)body=table(['仓库名称','仓库类型','库存池','关联渠道','状态'],rows.map(x=>`<tr><td>${x.wh}</td><td>${x.type}</td><td>${x.pool}</td><td>${x.channel}</td><td>演示启用</td></tr>`).join(''));app.innerHTML=`<h1>${pages[page]}</h1><p class="muted">掌握库存状态，支持日常运营决策</p><aside>ⓘ 当前为演示原型，所有数字及流水均为虚拟数据。库存池与渠道分别展示；待确认库存不参与预测。</aside>${filters}${body}`};draw();</script></html>
